<!DOCTYPE html>
<html>

<head>
  <title>Embed Builder</title>
  <link rel="stylesheet" href="dashboard.css">
</head>

<body>

<div class="box">

<h1>Embed Builder</h1>

<input id="channel" placeholder="Channel ID">

<input id="title" placeholder="Embed Title">

<textarea id="description" placeholder="Embed Description"></textarea>

<input id="color" placeholder="#5865F2">

<input id="footer" placeholder="Footer Text">

<input id="image" placeholder="Image URL">

<input id="thumbnail" placeholder="Thumbnail URL">

<textarea id="content" placeholder="@everyone or normal text"></textarea>

<button onclick="sendEmbed()">Send Embed</button>

</div>

<script>

async function sendEmbed() {

  const res = await fetch("/send-embed", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({

      channelId:
        document.getElementById("channel").value,

      title:
        document.getElementById("title").value,

      description:
        document.getElementById("description").value,

      color:
        document.getElementById("color").value,

      footer:
        document.getElementById("footer").value,

      image:
        document.getElementById("image").value,

      thumbnail:
        document.getElementById("thumbnail").value,

      content:
        document.getElementById("content").value
    })
  });

  alert("Embed sent.");
}

</script>

</body>
</html>
